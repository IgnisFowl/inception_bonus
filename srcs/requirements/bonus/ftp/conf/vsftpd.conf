listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES

# Comentado para evitar que o vsftpd tente bindar a porta 20 no NAT do Docker
# connect_from_port_20=YES

# Chroot local users to /var/www/html
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html
secure_chroot_dir=/var/run/vsftpd/empty

# Passive mode para o Docker
background=NO
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_addr_resolve=NO