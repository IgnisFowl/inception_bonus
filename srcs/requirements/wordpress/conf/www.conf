[www]
user = www-data
group = www-data

; Força o PHP-FPM a escutar na rede (porta 9000) em vez do socket Unix
listen = 0.0.0.0:9000

listen.owner = www-data
listen.group = www-data

; Configurações dinâmicas de processos (boas para a VM da 42)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no