secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

networks:
  inception_net:
    driver: bridge

volumes:
  wordpress_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aarie-c2/data/mariadb
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aarie-c2/data/wordpress
  portainer_data: # ── FIX: Declarado corretamente na raiz de volumes ──
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aarie-c2/data/portainer

services:

  # ─── Mandatory ──────────────────────────────────────────────────────────────

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_net
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    depends_on:
      - mariadb
      - redis
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_net
    restart: unless-stopped

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - wordpress_db:/var/lib/mysql
    networks:
      - inception_net
    restart: unless-stopped

  # ─── Bonus ──────────────────────────────────────────────────────────────────

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    image: redis
    networks:
      - inception_net
    restart: unless-stopped

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    image: ftp
    env_file: .env
    secrets:
      - credentials
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_net
    restart: unless-stopped

  website:
    build: ./requirements/bonus/website
    container_name: website
    image: website
    ports:
      - "8081:80"
    networks:
      - inception_net
    restart: unless-stopped

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - inception_net
    restart: unless-stopped

  portainer:
    build: ./requirements/bonus/portainer
    container_name: portainer
    image: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data # ── FIX: Vinculado de forma limpa ao container ──
    networks:
      - inception_net
    restart: unless-stopped